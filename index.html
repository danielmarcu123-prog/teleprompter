<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter Pro Studio</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Teleprompter">
    
    <link rel="manifest" id="manifest-placeholder">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video#preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #prompter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.35);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #prompter-scroll {
            position: absolute;
            top: 35%;
            width: 85%;
            max-width: 600px;
            text-align: center;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.95);
            line-height: 1.5;
            word-wrap: break-word;
            will-change: top;
            transition: transform 0.1s linear;
        }

        /* Mod oglindă */
        .mirrored {
            transform: scaleX(-1);
        }

        #reading-guide {
            position: absolute;
            top: 30%;
            left: 10%;
            width: 80%;
            height: 3px;
            background-color: rgba(241, 196, 15, 0.8);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
            z-index: 3;
            pointer-events: none;
            border-radius: 2px;
        }

        /* Countdown Overlay */
        #countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: bold;
            color: #f1c40f;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 92%;
            max-width: 420px;
            background: rgba(18, 18, 18, 0.92);
            padding: 14px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 55px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px;
            resize: none;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #3498db;
        }

        .tools-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tool-btn.active {
            background-color: #2980b9;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
        }

        #btn-record {
            background-color: #e74c3c;
            flex: 1.3;
        }

        #video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #recorded-video {
            width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            background: #000;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .btn-save {
            background-color: #27ae60 !important;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-close {
            background-color: #c0392b !important;
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="countdown-overlay"><span id="countdown-number">3</span></div>

    <div id="prompter-overlay">
        <div id="reading-guide"></div>
        <div id="prompter-scroll">
            Scrie sau lipește textul mai jos și apasă Start Înregistrare.
        </div>
    </div>

    <div id="controls">
        <textarea id="text-input" placeholder="Lipește textul tău aici..."></textarea>
        
        <div class="tools-bar">
            <button class="tool-btn" id="btn-mirror">Oglindă: OFF</button>
            <button class="tool-btn" id="btn-save-script">Salvează Script</button>
            <span id="stats-info" style="font-size: 11px; color: #aaa; align-self: center; margin-left: auto;">0 cuvinte (~0s)</span>
        </div>

        <div class="controls-row">
            <label>Viteză:</label>
            <input type="range" id="speed-control" min="1" max="20" value="5">
        </div>

        <div class="controls-row">
            <label>Mărime & Lățime:</label>
            <input type="range" id="font-control" min="20" max="55" value="32" style="width: 45%;">
            <input type="range" id="width-control" min="50" max="95" value="85" style="width: 45%;">
        </div>

        <div class="btn-group">
            <button id="btn-camera-flip">Cameră</button>
            <button id="btn-record">Start Înregistrare</button>
        </div>
    </div>

    <div id="video-modal">
        <h3 style="margin-bottom: 15px; color: #fff;">Filmarea ta este gata</h3>
        <video id="recorded-video" controls playsinline></video>
        <div class="modal-buttons">
            <a id="download-link" class="button btn-save" style="flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 13px; color: #fff;" download="teleprompter.mp4">Descarcă Video</a>
            <button class="btn-close" id="btn-close-modal">Închide</button>
        </div>
    </div>

    <script>
        const manifestData = {
            "name": "Teleprompter Pro",
            "short_name": "Teleprompter",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#000000"
        };
        const stringManifest = JSON.stringify(manifestData);
        const blobManifest = new Blob([stringManifest], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blobManifest));

        const video = document.getElementById('preview');
        const prompterScroll = document.getElementById('prompter-scroll');
        const textInput = document.getElementById('text-input');
        const speedControl = document.getElementById('speed-control');
        const fontControl = document.getElementById('font-control');
        const widthControl = document.getElementById('width-control');
        const btnRecord = document.getElementById('btn-record');
        const btnFlip = document.getElementById('btn-camera-flip');
        const btnMirror = document.getElementById('btn-mirror');
        const btnSaveScript = document.getElementById('btn-save-script');
        const statsInfo = document.getElementById('stats-info');
        
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNumber = document.getElementById('countdown-number');
        const videoModal = document.getElementById('video-modal');
        const recordedVideo = document.getElementById('recorded-video');
        const downloadLink = document.getElementById('download-link');
        const btnCloseModal = document.getElementById('btn-close-modal');

        let stream, mediaRecorder, recordedChunks = [], isRecording = false, scrollInterval;
        let currentFacingMode = 'user';
        let selectedMimeType = '';
        let currentPosition = 0;
        let isMirrored = false;

        if (localStorage.getItem('saved_teleprompter_text')) {
            textInput.value = localStorage.getItem('saved_teleprompter_text');
        }

        async function initCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Permite accesul la cameră și microfon.");
            }
        }

        btnFlip.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            video.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
            initCamera();
        });

        function updateTextStats() {
            const text = textInput.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            const speed = parseInt(speedControl.value);
            const estimatedSeconds = Math.round(words / (2 + speed * 0.3));
            statsInfo.innerText = `${words} cuv. (~${estimatedSeconds}s)`;
            localStorage.setItem('saved_teleprompter_text', textInput.value);
        }

        function prepareText() {
            const rawText = textInput.value.trim() || "Scrie sau lipește textul mai jos și apasă Start Înregistrare.";
            prompterScroll.innerText = rawText;
            updateTextStats();
        }

        textInput.addEventListener('input', prepareText);
        prepareText();

        fontControl.addEventListener('input', () => {
            prompterScroll.style.fontSize = fontControl.value + 'px';
        });
        prompterScroll.style.fontSize = fontControl.value + 'px';

        widthControl.addEventListener('input', () => {
            prompterScroll.style.width = widthControl.value + '%';
        });

        btnMirror.addEventListener('click', () => {
            isMirrored = !isMirrored;
            if (isMirrored) {
                prompterScroll.classList.add('mirrored');
                btnMirror.innerText = "Oglindă: ON";
                btnMirror.classList.add('active');
            } else {
                prompterScroll.classList.remove('mirrored');
                btnMirror.innerText = "Oglindă: OFF";
                btnMirror.classList.remove('active');
            }
        });

        btnSaveScript.addEventListener('click', () => {
            localStorage.setItem('saved_teleprompter_text', textInput.value);
            btnSaveScript.innerText = "Salvat! ✓";
            setTimeout(() => { btnSaveScript.innerText = "Salvează Script"; }, 2000);
        });

        function startScrolling() {
            currentPosition = window.innerHeight * 0.35;
            prompterScroll.style.top = currentPosition + 'px';

            scrollInterval = setInterval(() => {
                const speedValue = parseFloat(speedControl.value);
                currentPosition -= speedValue * 0.35;
                prompterScroll.style.top = currentPosition + 'px';

                if (currentPosition < -prompterScroll.offsetHeight) {
                    stopRecording();
                }
            }, 30);
        }

        function stopScrolling() { 
            clearInterval(scrollInterval);
        }

        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=h264,aac',
                'video/mp4',
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        function triggerRecordingSequence() {
            if (isRecording) {
                stopRecording();
                return;
            }

            countdownOverlay.style.display = 'flex';
            let count = 3;
            countdownNumber.innerText = count;

            const countdownTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.innerText = count;
                } else {
                    clearInterval(countdownTimer);
                    countdownOverlay.style.display = 'none';
                    startActualRecording();
                }
            }, 1000);
        }

        function startActualRecording() {
            recordedChunks = [];
            selectedMimeType = getSupportedMimeType();

            try {
                mediaRecorder = new MediaRecorder(stream, selectedMimeType ? { mimeType: selectedMimeType } : {});
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (e) => { 
                if (e.data && e.data.size > 0) recordedChunks.push(e.data); 
            };
            mediaRecorder.onstop = showVideoModal;

            mediaRecorder.start(1000);
            isRecording = true;
            btnRecord.innerText = "Oprește";
            btnRecord.style.backgroundColor = "#27ae60";

            startScrolling();
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            isRecording = false;
            btnRecord.innerText = "Start Înregistrare";
            btnRecord.style.backgroundColor = "#e74c3c";
            stopScrolling();
        }

        btnRecord.addEventListener('click', triggerRecordingSequence);

        function showVideoModal() {
            const type = selectedMimeType || 'video/mp4';
            const blob = new Blob(recordedChunks, { type: type });
            const videoUrl = URL.createObjectURL(blob);
            
            recordedVideo.src = videoUrl;
            downloadLink.href = videoUrl;
            downloadLink.download = `teleprompter_${Date.now()}.${type.includes('webm') ? 'webm' : 'mp4'}`;
            
            videoModal.style.display = 'flex';
        }

        btnCloseModal.addEventListener('click', () => {
            videoModal.style.display = 'none';
            recordedVideo.pause();
        });

        initCamera();
    </script>
</body>
</html>
