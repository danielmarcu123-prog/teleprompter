<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teleprompter Pro Studio</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Teleprompter">
    
    <link rel="manifest" id="manifest-placeholder">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video#preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #prompter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.35);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #prompter-scroll {
            position: absolute;
            top: 35%;
            width: 85%;
            max-width: 600px;
            text-align: center;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.95);
            line-height: 1.5;
            word-wrap: break-word;
            will-change: top;
            transition: transform 0.1s linear;
        }

        /* Mod oglindă */
        .mirrored {
            transform: scaleX(-1);
        }

        #reading-guide {
            position: absolute;
            top: 30%;
            left: 10%;
            width: 80%;
            height: 3px;
            background-color: rgba(241, 196, 15, 0.8);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
            z-index: 3;
            pointer-events: none;
            border-radius: 2px;
        }

        /* Countdown Overlay */
        #countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: bold;
            color: #f1c40f;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 92%;
            max-width: 420px;
            background: rgba(18, 18, 18, 0.92);
            padding: 14px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 55px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px;
            resize: none;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #3498db;
        }

        .tools-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tool-btn.active {
            background-color: #2980b9;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
        }

        #btn-record {
            background-color: #e74c3c;
            flex: 1.3;
        }

        #video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #recorded-video {
            width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            background: #000;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .btn-save {
            background-color: #27ae60 !important;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-close {
            background-color: #c0392b !important;
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="countdown-overlay"><span id="countdown-number">3</span></div>

    <div id="prompter-overlay">
        <div id="reading-guide"></div>
        <div id="prompter-scroll">
            Scrie sau lipește textul mai jos și apasă Start Înregistrare.
        </div>
    </div>

    <div id="controls">
        <textarea id="text-input" placeholder="Lipește textul tău aici..."></textarea>
        
        <div class="tools-bar">
            <button class="tool-btn" id="btn-mirror">Oglindă: OFF</button>
            <button class="tool-btn" id="btn-save-script">Salvează Script</button>
            <span id="stats-info" style="font-size: 11px; color: #aaa; align-self: center; margin-left: auto;">0 cuvinte (~0s)</span>
        </div>

        <div class="controls-row">
            <label>Viteză:</label>
            <input type="range" id="speed-control" min="1" max="20" value="5">
        </div>

        <div class="controls-row">
            <label>Mărime & Lățime:</label>
            <input type="range" id="font-control" min="20" max="55" value="32" style="width: 45%;">
            <input type="range" id="width-control" min="50" max="95" value="85" style="width: 45%;">
        </div>

        <div class="btn-group">
            <button id="btn-camera-flip">Cameră</button>
            <button id="btn-record">Start Înregistrare</button>
        </div>
    </div>

    <div id="video-modal">
        <h3 style="margin-bottom: 15px; color: #fff;">Filmarea ta este gata</h3>
        <video id="recorded-video" controls playsinline></video>
